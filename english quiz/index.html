<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Grammar Quest | English Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .glass { background: rgba(30, 41, 59, .82); backdrop-filter: blur(16px); }
    .option-button { transition: background-color .18s ease, border-color .18s ease, transform .18s ease; }
    .option-button:not(:disabled):hover { transform: translateY(-1px); }
    .option-button:focus-visible, button:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 3px; }
    .progress-fill { transition: width .35s ease; }
    @keyframes winner-pop {
      0% { opacity: 0; transform: scale(.72) translateY(8px); }
      65% { opacity: 1; transform: scale(1.06) translateY(-2px); }
      100% { transform: scale(1) translateY(0); }
    }
    @keyframes winner-sparkle {
      0%, 100% { opacity: .35; transform: scale(.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(18deg); }
    }
    @keyframes answer-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .winner-feedback { animation: winner-pop .48s cubic-bezier(.2,.8,.2,1) both; }
    .winner-sparkle { animation: winner-sparkle .9s ease-in-out infinite; }
    .try-again-feedback { animation: answer-shake .38s ease-in-out both; }
    .answer-effect {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
    }
    .answer-effect.is-visible { animation: effect-screen .2s ease-out both; }
    .answer-effect.is-correct { background: radial-gradient(ellipse at center, rgba(16, 185, 129, .2), rgba(15, 23, 42, .08) 60%, transparent 85%); }
    .answer-effect.is-wrong { background: radial-gradient(ellipse at center, rgba(244, 63, 94, .18), rgba(15, 23, 42, .08) 62%, transparent 86%); }
    .effect-message { text-align: center; animation: effect-message .65s cubic-bezier(.2,.8,.2,1) both; }
    .effect-emoji { display: block; font-size: clamp(5rem, 19vw, 11rem); line-height: 1; filter: drop-shadow(0 10px 35px rgba(0,0,0,.4)); }
    .effect-title { display: block; margin-top: 1rem; font-size: clamp(2.5rem, 10vw, 5rem); font-weight: 1000; letter-spacing: -.06em; text-shadow: 0 8px 35px rgba(0,0,0,.4); }
    .is-correct .effect-title { color: #a7f3d0; }
    .is-wrong .effect-title { color: #fecdd3; }
    .effect-particle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--size, 10px);
      height: calc(var(--size, 10px) * 1.6);
      border-radius: 3px;
      background: var(--particle-color);
      opacity: 0;
      animation: particle-burst 1.1s cubic-bezier(.12,.62,.22,1) both;
      animation-delay: var(--delay, 0ms);
    }
    @keyframes effect-screen {
      0% { opacity: 0; backdrop-filter: blur(0); }
      18% { opacity: 1; backdrop-filter: blur(3px); }
      100% { opacity: 1; backdrop-filter: blur(0); }
    }
    @keyframes effect-message {
      0% { opacity: 0; transform: scale(.55) translateY(20px); }
      65% { opacity: 1; transform: scale(1.08) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes particle-burst {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(0) scale(.3); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--spin)) scale(.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-indigo-500/40">
  <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-indigo-600/10 blur-3xl"></div>
    <div class="absolute -right-32 top-1/3 h-96 w-96 rounded-full bg-violet-600/10 blur-3xl"></div>
  </div>
  <div id="answerEffect" class="answer-effect" aria-hidden="true"></div>

  <div class="relative mx-auto flex min-h-screen max-w-5xl flex-col px-4 py-6 sm:px-6 lg:px-8">
  <header class="mb-8 flex items-center justify-between gap-4">
      <a href="#" class="flex items-center gap-3" aria-label="Grammar Quest home">
        <span class="grid h-11 w-11 place-items-center rounded-2xl bg-indigo-500 text-xl font-black shadow-lg shadow-indigo-950/60">G</span>
        <span>
          <span class="block text-sm font-bold tracking-wide text-white">GRAMMAR QUEST</span>
          <span class="block text-xs text-slate-400">Learn a rule. Master the language.</span>
        </span>
      </a>
      <div class="flex items-center gap-2">
        <button id="soundToggle" type="button" class="rounded-xl border border-slate-700 px-3 py-2 text-sm font-semibold text-slate-300 transition hover:border-slate-500 hover:text-white" aria-pressed="true" title="Turn answer sounds off">🔊 Sound on</button>
        <button id="restartButton" type="button" class="rounded-xl border border-slate-700 px-3 py-2 text-sm font-semibold text-slate-300 transition hover:border-slate-500 hover:text-white">Restart</button>
      </div>
    </header>

    <main class="flex-1">
      <section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/80 p-4 sm:p-5" aria-label="Learning progress">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <span id="stageBadge" class="rounded-full bg-indigo-500/15 px-3 py-1 text-xs font-bold tracking-wide text-indigo-300">READY</span>
            <span id="progressLabel" class="text-sm font-semibold text-slate-200">Rule 1 of 29</span>
          </div>

        </div>
        <div class="h-2 overflow-hidden rounded-full bg-slate-800" role="progressbar" aria-label="Overall course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progressFill" class="progress-fill h-full w-0 rounded-full bg-gradient-to-r from-indigo-500 to-violet-400"></div>
        </div>
        <div id="checkpointTrail" class="mt-3 flex flex-wrap gap-2 text-xs text-slate-500">
          <span data-checkpoint="1" class="rounded-lg border border-slate-800 px-2.5 py-1">Checkpoint 1 · after Rule 10</span>
          <span data-checkpoint="2" class="rounded-lg border border-slate-800 px-2.5 py-1">Checkpoint 2 · after Rule 20</span>
          <span data-checkpoint="final" class="rounded-lg border border-slate-800 px-2.5 py-1">Grand Test · after Rule 29</span>
        </div>
      </section>

      <div id="appContent" aria-live="polite"></div>
    </main>

    <footer class="mt-10 border-t border-slate-800/80 py-5 text-center text-xs text-slate-500">
      Grammar Quest · Your progress is temporary and resets when you restart or refresh.
    </footer>
  </div>

  <script>
    // Each practice item is [sentence, answer, distractor, explanation].
    const ruleContent = [
      {
        title: "চিরন্তন সত্য ও অভ্যাসগত কর্ম",
        description: "চিরন্তন সত্য, সাধারণ সত্য, নিত্য অভ্যাস, রীতিনীতি ও ঐতিহাসিক ঘটনা বর্ণনায় Present Indefinite ব্যবহার হয়। Third-person singular subject হলে verb-এর সঙ্গে s/es যোগ হয়।",
        items: [
          ["The earth (move) ___ round the sun.", "moves", "move", "এটি চিরন্তন সত্য; The earth একবচন হওয়ায় verb-এর সঙ্গে s যোগ হয়েছে।"],
          ["Water (boil) ___ at 100°C.", "boils", "boil", "বিজ্ঞানের সাধারণ সত্যে Present Indefinite হয়; Water-কে একবচন ধরে boils হয়েছে।"],
          ["The sun (rise) ___ in the east.", "rises", "rise", "প্রাকৃতিক সত্য প্রকাশে Present Indefinite হয়; The sun-এর সঙ্গে rises বসে।"],
          ["Honey (be) ___ sweet.", "is", "are", "গুণ বা সাধারণ সত্য বোঝাতে Present Indefinite-এর be verb is হয়।"],
          ["Ice (float) ___ on water.", "floats", "is floating", "স্বাভাবিক সত্য বোঝাতে Present Indefinite ব্যবহার হয়েছে।"]
        ]
      },
      {
        title: "নিয়মিত বা অভ্যাসগত কাজ",
        description: "Always, daily, regularly, normally, generally, often, sometimes, usually এবং every day-এর মতো শব্দ অভ্যাস বা নিয়মিত কাজ বোঝায়। এ ক্ষেত্রে Present Indefinite ব্যবহার হয়।",
        items: [
          ["He always (speak) ___ the truth.", "speaks", "is speaking", "Always নিত্য অভ্যাস বোঝায়; He-এর সঙ্গে speaks হয়।"],
          ["We (clean) ___ our classroom regularly.", "clean", "are cleaning", "Regularly নিয়মিত কাজ বোঝায়, তাই Present Indefinite clean হয়েছে।"],
          ["She (walk) ___ in the morning daily.", "walks", "is walking", "Daily অভ্যাস বোঝায়; She-এর সঙ্গে walks বসে।"],
          ["They usually (play) ___ football in the afternoon.", "play", "plays", "Usually অভ্যাসগত কাজ; They plural subject হওয়ায় play হয়।"],
          ["My mother (read) ___ the Holy Quran every day.", "reads", "is reading", "Every day নিয়মিত অভ্যাস বোঝায়; My mother একবচন বলে reads হয়েছে।"]
        ]
      },
      {
        title: "ভবিষ্যতে নির্ধারিত কাজ বা ঘটনা",
        description: "ভবিষ্যতের কোনো সময়সূচি, রুটিন বা পূর্বনির্ধারিত কর্মসূচির কথা বললেও Present Indefinite ব্যবহার করা যায়।",
        items: [
          ["Raju (go) ___ to Singapore next month.", "goes", "will goes", "পূর্বনির্ধারিত ভবিষ্যৎ পরিকল্পনা বোঝানো হয়েছে; Present Indefinite goes ব্যবহৃত।"],
          ["Our school (close) ___ next Sunday.", "closes", "will closes", "সূচি অনুযায়ী নির্ধারিত ভবিষ্যৎ ঘটনা বোঝাতে Present Indefinite closes হয়।"],
          ["The Prime Minister (arrive) ___ tomorrow.", "arrives", "will arrives", "পূর্বনির্ধারিত সফর বা সময়সূচিতে Present Indefinite ব্যবহার হয়েছে।"],
          ["My uncle (leave) ___ for Dhaka next week.", "leaves", "will leaves", "নির্ধারিত ভবিষ্যৎ ভ্রমণ বোঝাতে leaves হয়েছে।"],
          ["The examination (start) ___ next Sunday.", "starts", "will starts", "ঘোষিত সময়সূচি অনুযায়ী ভবিষ্যৎ ঘটনা; The examination একবচন বলে starts।"]
        ]
      },
      {
        title: "অতীত নির্দেশক শব্দ",
        description: "Yesterday, last week/month/year, ago, long ago, formerly এবং the previous day-এর মতো নির্দিষ্ট অতীত-সময়ের শব্দ থাকলে সাধারণত Past Indefinite ব্যবহার হয়।",
        items: [
          ["I (go) ___ to school yesterday.", "went", "go", "Yesterday নির্দিষ্ট অতীত সময়; go-এর past form went।"],
          ["They (come) ___ here a few days ago.", "came", "have come", "Ago অতীত সময় নির্দেশ করে; come-এর past form came।"],
          ["He (visit) ___ his grandparents last week.", "visited", "visits", "Last week-এর কারণে Past Indefinite visited হয়েছে।"],
          ["Columbus (discover) ___ America long ago.", "discovered", "has discovered", "Long ago অতীত সময় নির্দেশ করে; discovered ব্যবহার হয়।"],
          ["She (buy) ___ a new dress the previous day.", "bought", "buys", "The previous day অতীত নির্দেশ করে; buy-এর past form bought।"]
        ]
      },
      {
        title: "It is time / It is high time",
        description: "It is time বা It is high time-এর পরে subject এলে পরের verb-এর Past Indefinite form ব্যবহার হয়; অর্থটি বর্তমানের করণীয় বা বিলম্ব বোঝায়।",
        items: [
          ["It is high time we (take) ___ action against corruption.", "took", "take", "It is high time + subject construction-এ Past Indefinite took হয়।"],
          ["It is time you (change) ___ your bad habits.", "changed", "change", "It is time-এর পর subject থাকায় verb-এর past form changed বসে।"],
          ["It is high time he (start) ___ a business.", "started", "starts", "High time construction-এ started ব্যবহৃত হয়।"],
          ["I fancy it (rain) ___ last night.", "rained", "rains", "Last night অতীত নির্দেশ করে; তাই Past Indefinite rained হয়েছে।"],
          ["It is time we (leave) ___ the place.", "left", "leave", "It is time + subject-এর পর Past Indefinite left হয়।"]
        ]
      },
      {
        title: "অসম্ভব ইচ্ছা বা কল্পনা",
        description: "বর্তমানের অবাস্তব ইচ্ছা বা কল্পনায় If I were, I wish-এর পরে were, have-এর past form had, এবং সাধারণ verb-এর Past Indefinite ব্যবহৃত হয়।",
        items: [
          ["If I (be) ___ a bird!", "were", "am", "অবাস্তব কল্পনায় be-এর ক্ষেত্রে subject যাই হোক were ব্যবহৃত হয়।"],
          ["I wish I (be) ___ a king.", "were", "was", "I wish-এর পর অবাস্তব ইচ্ছায় were প্রচলিত subjunctive form।"],
          ["Would that I (be) ___ a billionaire!", "were", "am", "অবাস্তব আকাঙ্ক্ষায় be-এর past subjunctive were বসে।"],
          ["If she (have) ___ the wings of a bird!", "had", "has", "Have-এর Past Indefinite form had দিয়ে অবাস্তব ইচ্ছা প্রকাশ হয়েছে।"],
          ["I wish I (fly) ___ in the sky.", "flew", "will fly", "বর্তমানের অসম্ভব ইচ্ছায় fly-এর Past Indefinite form flew হয়।"]
        ]
      },
      {
        title: "অতীতের দুটি ঘটনা: as soon as / when",
        description: "অতীতে পরপর বা প্রায় একই সময়ে ঘটা দুটি সম্পূর্ণ ঘটনা as soon as, when বা as দিয়ে যুক্ত হলে উভয় clause-এ Past Indefinite ব্যবহার করা হয়।",
        items: [
          ["As soon as we (reach) ___ the station, the train left.", "reached", "had reached", "এখানে অতীতের পরপর ঘটা দুটি ঘটনা Past Indefinite-এ আছে।"],
          ["When the bell rang, the students (leave) ___ the room.", "left", "were leaving", "Bell ring ও room leave—দুটি সম্পূর্ণ অতীত ঘটনা; তাই left।"],
          ["As the dog lay close to him, it (find) ___ comfort there.", "found", "was finding", "As-যুক্ত অতীত ঘটনার ধারাবাহিকতায় Past Indefinite found হয়েছে।"],
          ["He came home when I (call) ___ him.", "called", "was calling", "When-clause-এ অতীতে ঘটা সম্পূর্ণ কাজ বোঝাতে Past Indefinite called হয়েছে।"],
          ["As soon as he saw me, he (run) ___ away.", "ran", "was running", "As soon as-যুক্ত পরপর অতীত ঘটনার জন্য ran বসেছে।"]
        ]
      },
      {
        title: "অতীতের চলমান কাজের মধ্যে অন্য ঘটনা",
        description: "অতীতে একটি কাজ চলার সময় অন্য একটি ঘটনা ঘটলে চলমান কাজটি Past Continuous এবং ঘটনাটি Past Indefinite হয়।",
        items: [
          ["While I was walking on the street, I (see) ___ a beautiful bird.", "saw", "was seeing", "হাঁটা চলমান ছিল; পাখি দেখা আলাদা ঘটনা, তাই Past Indefinite saw।"],
          ["When he was sleeping, the phone (ring) ___.", "rang", "was ringing", "ঘুম চলমান ছিল; ফোন বেজে ওঠা ঘটনার Past form rang।"],
          ["While she (cook) ___, the milk spilled.", "was cooking", "cooked", "রান্না চলমান ছিল; তাই Past Continuous was cooking।"],
          ["It started to rain while we (play) ___ football.", "were playing", "played", "খেলার কাজটি বৃষ্টি শুরুর সময় চলছিল; তাই were playing।"],
          ["The thief ran away while the guard (sleep) ___.", "was sleeping", "slept", "প্রহরীর ঘুম চলমান ছিল; singular subject guard-এর সঙ্গে was sleeping।"]
        ]
      },
      {
        title: "ভবিষ্যৎ সম্ভাবনা",
        description: "ভবিষ্যতে ঘটবে বলে অনুমান, প্রত্যাশা বা সম্ভাবনা বোঝাতে will/shall + verb-এর মূল রূপ ব্যবহার হয়।",
        items: [
          ["Orpa (be) ___ a singer one day.", "will be", "is", "One day ভবিষ্যৎ বোঝায়; will + be ব্যবহৃত হয়েছে।"],
          ["He (pass) ___ the exam easily.", "will pass", "passes", "ভবিষ্যৎ সম্ভাবনায় will-এর পরে মূল verb pass বসে।"],
          ["Bangladesh (prosper) ___ in the coming decades.", "will prosper", "prospered", "Coming decades ভবিষ্যৎ সময়; will prosper সঠিক গঠন।"],
          ["They (win) ___ the match.", "will win", "wins", "ভবিষ্যৎ ফলের সম্ভাবনায় will + win হয়।"],
          ["The sun (shine) ___ brightly tomorrow.", "will shine", "shines", "Tomorrow ভবিষ্যৎ সময় নির্দেশ করে; will shine হয়।"]
        ]
      },
      {
        title: "Tomorrow / next week-এর মতো ভবিষ্যৎ-সময়",
        description: "Tomorrow, next week, next month বা coming year-এর মতো ভবিষ্যৎ সময়ের উল্লেখে সাধারণত Future Indefinite: will/shall + মূল verb।",

        makeTestQuestion(16, "Why ___ you (look) so sad yesterday?", "did", "do", "Yesterday-সহ প্রশ্নে did + subject + base verb হয়।", 1),
        makeTestQuestion(17, "He wants (buy) ___ a new smartphone.", "to buy", "buying to", "Want-এর পরে infinitive to buy বসে।", 0),
        makeTestQuestion(18, "Many years have passed since I (meet) ___ him.", "met", "have met", "Since-clause-এ অতীতে ঘটে যাওয়া সাক্ষাৎ Past Indefinite met দিয়ে বোঝানো হয়।", 1),
        makeTestQuestion(19, "It was long since I (visit) ___ my village home.", "had visited", "will visit", "অতীত reference point-এর আগে ঘটে যাওয়া কাজ; Past Perfect।", 0),
        makeTestQuestion(20, "The patient had died before the doctor (come) ___.", "came", "had came", "Before-clause-এ পরে ঘটা কাজ Past Indefinite came হয়।", 1)
      ],
      final: [
        makeTestQuestion(21, "He speaks as though he (know) ___ everything.", "knew", "knows", "Present main clause-এর পরে কল্পিত তুলনায় Past Indefinite হয়।", 0),
        makeTestQuestion(22, "She behaved as if she (see) ___ a ghost.", "had seen", "sees", "Past main clause-এর পরে আগের কল্পিত ঘটনা Past Perfect হয়।", 1),
        makeTestQuestion(23, "Keep quiet until the teacher (come) ___.", "comes", "will come", "Until time clause-এ future অর্থ থাকলেও Present Indefinite হয়।", 0),
        makeTestQuestion(24, "Would that I (be) ___ a pilot!", "could be", "am", "Would that-এর পরে could + মূল verb দিয়ে আকাঙ্ক্ষা বোঝায়।", 1),
        makeTestQuestion(25, "The Headmaster and the Secretary (be) ___ present. (দুজন আলাদা ব্যক্তি)", "are", "is", "দুটি article আলাদা ব্যক্তিকে বোঝায়; plural are হয়।", 0),
        makeTestQuestion(26, "If you freeze water, it (turn) ___ into ice.", "turns", "will turn", "সার্বজনীন সত্যে Zero Conditional-এর দুই clause-ই Present হয়।", 1),
        makeTestQuestion(27, "If you work hard, you (shine) ___ in life.", "will shine", "would shine", "বাস্তব ভবিষ্যৎ সম্ভাবনায় First Conditional-এর ফল will + V1।", 0),
        makeTestQuestion(28, "If I had wings, I (fly) ___ across the world.", "would fly", "will fly", "Had wings বর্তমানের কল্পনা; Second Conditional-এ would + V1 হয়।", 1),
        makeTestQuestion(29, "If you had informed me, I (help) ___ you.", "would have helped", "would help", "Past Perfect if-clause-এর ফল Third Conditional-এ would have + V3 হয়।", 0),
        makeTestQuestion(28, "If I were you, I (accept) ___ the offer.", "would accept", "will accept", "If I were you বর্তমানের কাল্পনিক শর্ত; would + V1 হয়।", 1)
      ]
    };

    const appContent = document.getElementById("appContent");
    const stageBadge = document.getElementById("stageBadge");
    const progressLabel = document.getElementById("progressLabel");
    const scoreLabel = document.getElementById("scoreLabel");
    const progressFill = document.getElementById("progressFill");
    const progressBar = document.querySelector('[role="progressbar"]');
    const answerEffect = document.getElementById("answerEffect");
    const soundToggle = document.getElementById("soundToggle");

    let ruleIndex = 0;
    let questionIndex = 0;
    let stage = "rule";
    let activeQuestions = [];
    let selectedIndex = null;
    let correctTotal = 0;
    let answeredTotal = 0;
    let soundEnabled = true;
    let audioContext = null;
    let effectTimer = null;
    let completedStages = new Set();
    let answerBreakdown = { practice: { correct: 0, total: 0 }, checkpoint1: { correct: 0, total: 0 }, checkpoint2: { correct: 0, total: 0 }, final: { correct: 0, total: 0 } };

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function setSoundEnabled(enabled) {
      soundEnabled = enabled;
      soundToggle.textContent = enabled ? "🔊 Sound on" : "🔇 Sound off";
      soundToggle.setAttribute("aria-pressed", String(enabled));
      soundToggle.title = enabled ? "Turn answer sounds off" : "Turn answer sounds on";
    }

    function playAnswerSound(correct) {
      if (!soundEnabled) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        setSoundEnabled(false);
        soundToggle.title = "Sound is not supported in this browser";
        return;
      }

      try {
        audioContext ||= new AudioContextClass();
        const notes = correct
          ? [{ frequency: 523.25, time: 0, duration: 0.18 }, { frequency: 659.25, time: 0.12, duration: 0.2 }, { frequency: 783.99, time: 0.25, duration: 0.32 }]
          : [{ frequency: 260, time: 0, duration: 0.2 }, { frequency: 190, time: 0.17, duration: 0.3 }];

        audioContext.resume().then(() => {
          const now = audioContext.currentTime;
          notes.forEach((note) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const startAt = now + note.time;
            oscillator.type = correct ? "sine" : "triangle";
            oscillator.frequency.setValueAtTime(note.frequency, startAt);
            gain.gain.setValueAtTime(0.0001, startAt);
            gain.gain.exponentialRampToValueAtTime(0.055, startAt + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, startAt + note.duration);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(startAt);
            oscillator.stop(startAt + note.duration);
          });
        }).catch(() => {
          setSoundEnabled(false);
          soundToggle.title = "Could not play sound. Click to try again.";
        });
      } catch {
        setSoundEnabled(false);
        soundToggle.title = "Could not play sound. Click to try again.";
      }
    }

    function showAnswerEffect(correct) {
      const colors = correct
        ? ["#34d399", "#a3e635", "#facc15", "#818cf8", "#f472b6", "#ffffff"]
        : ["#fb7185", "#f43f5e", "#fda4af", "#ffffff"];
      const particleCount = correct ? 46 : 20;
      const message = makeElement("div", "effect-message");
      message.append(
        makeElement("span", "effect-emoji", correct ? "🏆" : "😵‍💫"),
        makeElement("span", "effect-title", correct ? "WINNER!" : "LOSER!")
      );

      answerEffect.className = `answer-effect is-visible ${correct ? "is-correct" : "is-wrong"}`;
      answerEffect.replaceChildren();
      for (let i = 0; i < particleCount; i++) {
        const particle = makeElement("span", "effect-particle");
        const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.22;
        const distance = 90 + Math.random() * Math.min(window.innerWidth, window.innerHeight) * 0.52;
        particle.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        particle.style.setProperty("--spin", `${Math.round(Math.random() * 720 - 360)}deg`);
        particle.style.setProperty("--size", `${5 + Math.random() * 9}px`);
        particle.style.setProperty("--delay", `${Math.round(Math.random() * 100)}ms`);
        particle.style.setProperty("--particle-color", colors[i % colors.length]);
        answerEffect.append(particle);
      }
      answerEffect.append(message);
      window.clearTimeout(effectTimer);
      effectTimer = window.setTimeout(() => {
        answerEffect.className = "answer-effect";
        answerEffect.replaceChildren();
      }, 1500);
    }

    function setProgress(label, badge, percent) {
      progressLabel.textContent = label;
      stageBadge.textContent = badge;
      const safePercent = Math.max(0, Math.min(100, percent));
      progressFill.style.width = `${safePercent}%`;
      progressBar.setAttribute("aria-valuenow", String(Math.round(safePercent)));
      scoreLabel.textContent = `${correctTotal} correct · ${answeredTotal} answered`;
      document.querySelectorAll("[data-checkpoint]").forEach((item) => {
        const key = item.dataset.checkpoint;
        const complete = completedStages.has(key);
        item.className = complete
          ? "rounded-lg border border-emerald-500/40 bg-emerald-500/10 px-2.5 py-1 text-emerald-300"
          : "rounded-lg border border-slate-800 px-2.5 py-1 text-slate-500";
      });
    }

    function renderRuleCard() {
      const rule = rulesDatabase[ruleIndex];
      setProgress(`Rule ${rule.id} of 29`, "LEARN THE RULE", ((rule.id - 1) / 29) * 100);
      const card = makeElement("article", "glass rounded-3xl border border-slate-700/80 p-6 shadow-2xl shadow-black/20 sm:p-9");
      const eyebrow = makeElement("p", "mb-3 text-xs font-bold uppercase tracking-[.2em] text-indigo-300", `Lesson ${String(rule.id).padStart(2, "0")} · Rule ${rule.id} of 29`);
      const title = makeElement("h1", "text-3xl font-black tracking-tight text-white sm:text-4xl", rule.title);
      const description = makeElement("p", "mt-5 max-w-3xl whitespace-pre-line text-base leading-7 text-slate-300", rule.description);
      card.append(eyebrow, title, description);

      const examples = makeElement("div", "mt-7 grid gap-3 sm:grid-cols-2");
      rule.examples.forEach(([english, bengali]) => {
        const exampleCard = makeElement("div", "rounded-xl border border-slate-700 bg-slate-900/70 p-4");
        exampleCard.append(
          makeElement("p", "text-sm leading-6 text-slate-200", english),
          makeElement("p", "mt-2 border-t border-slate-700/70 pt-2 text-sm leading-6 text-indigo-200", `বাংলা: ${bengali}`)
        );
        examples.append(exampleCard);
      });
      card.append(examples);

      const note = makeElement("p", "mt-6 text-sm text-slate-400", "These examples are for learning. Your five practice questions use different sentences.");
      const start = makeElement("button", "mt-7 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-500 px-5 py-3.5 font-bold text-white shadow-lg shadow-indigo-950/50 transition hover:bg-indigo-400 sm:w-auto", "Start 5-question practice");
      start.type = "button";
      start.addEventListener("click", () => beginStage("practice", rule.questions));
      card.append(note, start);
      appContent.replaceChildren(card);
    }

    function beginStage(nextStage, questions) {
      stage = nextStage;
      activeQuestions = questions;
      questionIndex = 0;
      selectedIndex = null;
      renderQuestion();
    }

    function getStageInfo() {
      if (stage === "practice") {
        return { label: `Rule ${ruleIndex + 1} practice · ${questionIndex + 1} of 5`, badge: "RULE PRACTICE" };
      }
      if (stage === "checkpoint1") return { label: `Checkpoint 1 · Question ${questionIndex + 1} of ${activeQuestions.length}`, badge: "CHECKPOINT 1" };
      if (stage === "checkpoint2") return { label: `Checkpoint 2 · Question ${questionIndex + 1} of ${activeQuestions.length}`, badge: "CHECKPOINT 2" };
      return { label: `Grand Test · Question ${questionIndex + 1} of ${activeQuestions.length}`, badge: "FINAL GRAND TEST" };
    }

    function renderQuestion() {
      const question = activeQuestions[questionIndex];
      const questionRule = rulesDatabase[(question.ruleId || ruleIndex + 1) - 1];
      const info = getStageInfo();
      const overallPercent = stage === "practice"
        ? ((ruleIndex + questionIndex / activeQuestions.length) / 29) * 100
        : stage === "checkpoint1" ? (10 / 29) * 100
          : stage === "checkpoint2" ? (20 / 29) * 100 : 100;
      setProgress(info.label, info.badge, overallPercent);

      const card = makeElement("section", "glass rounded-3xl border border-slate-700/80 p-5 shadow-2xl shadow-black/20 sm:p-8");
      const topLine = makeElement("div", "mb-5 flex flex-wrap items-center justify-between gap-2");
      topLine.append(
        makeElement("span", "rounded-lg bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-300", questionRule.title),
        makeElement("span", "text-xs font-medium text-slate-500", `Question ${questionIndex + 1} / ${activeQuestions.length}`)
      );
      const heading = makeElement("h1", "text-xl font-bold leading-8 text-white sm:text-2xl", question.question);
      const options = makeElement("div", "mt-6 grid gap-3");
      const letters = ["A", "B", "C", "D", "E", "F"];

      question.options.forEach((option, index) => {
        const button = makeElement("button", "option-button flex w-full items-center gap-3 rounded-xl border border-slate-700 bg-slate-900/70 p-3.5 text-left text-sm leading-6 text-slate-200 sm:p-4");
        button.type = "button";
        button.disabled = selectedIndex !== null;
        const letter = makeElement("span", "grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-slate-800 text-xs font-bold text-slate-300", letters[index] || String(index + 1));
        const answerText = makeElement("span", "flex-1", option);
        button.append(letter, answerText);

        if (selectedIndex !== null && index === question.correctIndex) {
          button.className = "option-button flex w-full items-center gap-3 rounded-xl border border-emerald-400 bg-emerald-500 p-3.5 text-left text-sm font-semibold leading-6 text-emerald-950 sm:p-4";
          letter.className = "grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-emerald-600/25 text-xs font-bold text-emerald-950";
        } else if (selectedIndex === index) {
          button.className = "option-button flex w-full items-center gap-3 rounded-xl border border-rose-400 bg-rose-500 p-3.5 text-left text-sm font-semibold leading-6 text-rose-950 sm:p-4";
          letter.className = "grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-rose-600/25 text-xs font-bold text-rose-950";
        } else if (selectedIndex !== null) {
          button.className = "option-button flex w-full items-center gap-3 rounded-xl border border-slate-800 bg-slate-900/50 p-3.5 text-left text-sm leading-6 text-slate-500 opacity-60 sm:p-4";
        }

        button.addEventListener("click", () => selectAnswer(index));
        options.append(button);
      });

      card.append(topLine, heading, options);
      if (selectedIndex !== null) {
        const isCorrect = selectedIndex === question.correctIndex;
        const explanation = makeElement("div", `mt-5 rounded-xl border p-4 ${isCorrect ? "winner-feedback border-emerald-400/40 bg-gradient-to-r from-emerald-500/15 via-emerald-500/10 to-indigo-500/10" : "try-again-feedback border-rose-400/30 bg-rose-500/10"}`);
        const resultRow = makeElement("div", "flex flex-wrap items-center gap-2");
        const resultBadge = makeElement("span", `inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-black ${isCorrect ? "bg-emerald-400/20 text-emerald-300" : "bg-rose-400/15 text-rose-300"}`, isCorrect ? "🏆 Winner!" : "😅 Try again!");
        resultRow.append(resultBadge);
        if (isCorrect) {
          resultRow.append(makeElement("span", "winner-sparkle text-lg", "✨"));
          resultRow.append(makeElement("span", "text-sm font-semibold text-emerald-200", "You got it right!"));
        } else {
          resultRow.append(makeElement("span", "text-sm font-semibold text-rose-200", "The correct answer is highlighted above."));
        }
        const explanationText = makeElement("p", "mt-1 text-sm leading-6 text-slate-300", question.explanation);
        explanation.append(resultRow, explanationText);
        card.append(explanation);

        const next = makeElement("button", "mt-6 flex w-full items-center justify-center rounded-xl bg-indigo-500 px-5 py-3.5 font-bold text-white transition hover:bg-indigo-400 sm:ml-auto sm:w-auto", questionIndex === activeQuestions.length - 1 ? "Finish this section" : "Next question");
        next.type = "button";
        next.addEventListener("click", advanceQuestion);
        card.append(next);
      } else {
        const hint = makeElement("p", "mt-5 text-center text-xs text-slate-500", "Choose one answer to see the explanation.");
        card.append(hint);
      }
      appContent.replaceChildren(card);
    }

    function selectAnswer(index) {
      if (selectedIndex !== null) return;
      selectedIndex = index;
      const question = activeQuestions[questionIndex];
      const correct = index === question.correctIndex;
      showAnswerEffect(correct);
      playAnswerSound(correct);
      answeredTotal += 1;
      if (correct) correctTotal += 1;
      const category = stage === "practice" ? "practice" : stage;
      answerBreakdown[category].total += 1;
      if (correct) answerBreakdown[category].correct += 1;
      renderQuestion();
    }

    function advanceQuestion() {
      if (selectedIndex === null) return;
      if (questionIndex < activeQuestions.length - 1) {
        questionIndex += 1;
        selectedIndex = null;
        renderQuestion();
        return;
      }
      finishStage();
    }

    function finishStage() {
      if (stage === "practice") {
        if (ruleIndex === 9) {
          beginStage("checkpoint1", checkpointQuestions.checkpoint1);
        } else if (ruleIndex === 19) {
          beginStage("checkpoint2", checkpointQuestions.checkpoint2);
        } else if (ruleIndex === 28) {
          beginStage("final", checkpointQuestions.final);
        } else {
          ruleIndex += 1;
          stage = "rule";
          renderRuleCard();
        }
      } else if (stage === "checkpoint1") {
        completedStages.add("1");
        ruleIndex = 10;
        stage = "rule";
        renderRuleCard();
      } else if (stage === "checkpoint2") {
        completedStages.add("2");
        ruleIndex = 20;
        stage = "rule";
        renderRuleCard();
      } else {
        completedStages.add("final");
        renderResults();
      }
    }

    function renderResults() {
      setProgress("Course complete · 29 rules mastered", "COURSE COMPLETE", 100);
      const percent = answeredTotal ? Math.round((correctTotal / answeredTotal) * 100) : 0;
      const card = makeElement("section", "glass rounded-3xl border border-slate-700/80 p-6 shadow-2xl shadow-black/20 sm:p-9");
      const icon = makeElement("div", "mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-emerald-500/15 text-3xl text-emerald-300", "✓");
      icon.setAttribute("aria-hidden", "true");
      const heading = makeElement("h1", "mt-5 text-center text-3xl font-black text-white sm:text-4xl", "You completed Grammar Quest!");
      const summary = makeElement("p", "mx-auto mt-3 max-w-xl text-center leading-7 text-slate-300", `You answered ${answeredTotal} questions and got ${correctTotal} correct. Keep practising to make the rules stick.`);
      const score = makeElement("div", "mt-7 rounded-2xl border border-indigo-400/20 bg-indigo-500/10 p-5 text-center");
      score.append(
        makeElement("p", "text-sm font-semibold uppercase tracking-widest text-indigo-300", "Overall score"),
        makeElement("p", "mt-1 text-5xl font-black text-white", `${percent}%`),
        makeElement("p", "mt-2 text-sm text-slate-400", `${correctTotal} correct out of ${answeredTotal}`)
      );
      const breakdown = makeElement("div", "mt-6 grid gap-3 sm:grid-cols-2");
      const rows = [
        ["Rule practice", answerBreakdown.practice],
        ["Checkpoint 1 · Rules 1–10", answerBreakdown.checkpoint1],
        ["Checkpoint 2 · Rules 11–20", answerBreakdown.checkpoint2],
        ["Final grand test", answerBreakdown.final]
      ];
      rows.forEach(([label, result]) => {
        const row = makeElement("div", "flex items-center justify-between gap-3 rounded-xl border border-slate-700 bg-slate-900/60 p-4");
        row.append(makeElement("span", "text-sm text-slate-300", label), makeElement("span", "text-sm font-bold text-white", `${result.correct} / ${result.total}`));
        breakdown.append(row);
      });
      const restart = makeElement("button", "mt-7 w-full rounded-xl bg-indigo-500 px-5 py-3.5 font-bold text-white transition hover:bg-indigo-400 sm:w-auto", "Start again");
      restart.type = "button";
      restart.addEventListener("click", resetCourse);
      card.append(icon, heading, summary, score, breakdown, makeElement("p", "mt-5 text-center text-xs text-slate-500", "This score is temporary and will reset when you restart or refresh the page."), restart);
      appContent.replaceChildren(card);
    }

    function resetCourse() {
      ruleIndex = 0;
      questionIndex = 0;
      stage = "rule";
      activeQuestions = [];
      selectedIndex = null;
      correctTotal = 0;
      answeredTotal = 0;
      completedStages = new Set();
      answerBreakdown = { practice: { correct: 0, total: 0 }, checkpoint1: { correct: 0, total: 0 }, checkpoint2: { correct: 0, total: 0 }, final: { correct: 0, total: 0 } };
      renderRuleCard();
    }

    soundToggle.addEventListener("click", () => setSoundEnabled(!soundEnabled));
    document.getElementById("restartButton").addEventListener("click", resetCourse);
    renderRuleCard();
  </script>
</body>
</html>
